<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Kubocycle</title>
<style>
:root{--bg:#000;--ink:#F2F5F6;--mut:#BCC9D0;--line:#33444C;--card:#0B1114;--con:#FF5448;--fav:#2EE077;--lat:#FFB830;--acc:#5BC0EB;--s:#8A9BA3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
h1{font-size:1.15rem;line-height:1.1;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0;text-align:center;background:linear-gradient(90deg,var(--acc),var(--fav));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
h1::after{content:"";display:block;width:56px;height:3px;border-radius:2px;margin:4px auto 0;background:linear-gradient(90deg,var(--acc),var(--fav))}
#top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;height:32px;flex:none}
#top h1{font-size:min(1.15rem,4.7vw);letter-spacing:.06em;white-space:nowrap}
#start,#fine{display:flex;align-items:center;justify-content:center;height:32px;font:inherit;font-size:.9rem;font-weight:800;border-radius:12px;padding:0 12px;white-space:nowrap}
#start{background:var(--acc);color:#001018;border:1px solid var(--acc)}
#fine{display:none;color:var(--ink);background:var(--card);border:1px solid var(--line)}
body.rec #fine{display:flex}
body.rec #start{display:none}
#hrbar{flex:none;display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font:inherit;color:var(--ink);text-align:left;width:100%}
#hrbar svg{width:18px;height:18px;flex:none;fill:#8A9BA3;stroke:none}
#hrbar.on svg{fill:#FF4D6D;animation:beat 1s ease-in-out infinite}
#hrbar.wait svg{fill:var(--lat)}
@keyframes beat{50%{transform:scale(1.18)}}
#hrv{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
#hrv small{font-size:.75em;font-weight:700;color:var(--mut);margin-left:3px}
#hrv.idle{font-size:.9rem;font-weight:700;color:var(--mut)}
#hrs{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--mut);white-space:nowrap}
#gps{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;color:var(--con)}
#batv #gps{width:16px;height:16px;margin-right:2px}
#batv #gps.on{color:#FFD60A}
#batv #gps.off{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
#resume{position:fixed;inset:0;z-index:45;display:none;background:rgba(0,0,0,.94);align-items:center;justify-content:center;padding:20px}
#resume.on{display:flex}
.rbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.rbox h2{margin:0;font-size:1.25rem}
.rbox p{margin:0 0 6px;color:var(--mut);font-size:1rem;line-height:1.35}
.rbox button{font:inherit;font-size:1rem;font-weight:800;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.rbox button.go{background:var(--fav);border-color:var(--fav);color:#001a0d}
#err{color:var(--con);font-size:1rem}
#err:empty{display:none}
#main{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}


.thead{display:flex;justify-content:space-between;align-items:baseline;color:var(--ink);font-size:1.05rem;font-weight:700;line-height:1.2}
.thead small{font-size:.85rem;font-weight:600;color:var(--mut)}
.big{font-size:min(3.2rem,6.6vh);font-size:min(3.2rem,6.6dvh);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;margin:auto 0}
.big small{font-size:.55em;font-weight:800;margin-left:2px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1}
.tcard{flex:1;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 18px}
.pair .tcard{justify-content:space-between;min-height:0;padding:9px 12px;gap:4px}
.pair .tcard>span{display:block;line-height:1.2}
.pair .temp{font-size:min(2.7rem,5.4vh);font-size:min(2.7rem,5.4dvh);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;margin:auto 0}
.pair .temp small{font-size:.7em;font-weight:800;color:inherit;margin-left:2px}
.tcard>span{color:var(--ink);font-size:1.05rem;font-weight:700}
.temp{font-size:3.4rem;font-weight:800;line-height:1}
.temp small{font-size:1.4rem;font-weight:500;color:var(--mut);margin-left:3px}
.foot{color:var(--mut);font-size:.85rem}
body{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#title{touch-action:manipulation;cursor:default}
#egg{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.92);align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
#egg.on{display:flex}
#egg svg{width:min(88vw,460px);height:auto;overflow:visible;animation:ride 4.8s ease-in-out forwards}
#egg p{position:absolute;bottom:16%;margin:0;color:var(--ink);font-weight:800;font-size:1.2rem;letter-spacing:.04em;text-align:center;padding:0 20px}
@keyframes ride{from{transform:translateX(-115vw)}to{transform:translateX(115vw)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes road{to{stroke-dashoffset:-24}}
.wheel{animation:spin .55s linear infinite}
.tire{fill:none;stroke:#F2F5F6;stroke-width:4}
.spk line{stroke:#8A9BA3;stroke-width:1.6}
.frame line{stroke:#5BC0EB;stroke-width:4;stroke-linecap:round}
.frame .sad{stroke:#F2F5F6;stroke-width:5}
.leg{stroke:#1F9E86;stroke-width:6;stroke-linecap:round}
.crk{stroke:#8A9BA3;stroke-width:3;stroke-linecap:round}
.foot{fill:#F2F5F6;stroke:#0B1114;stroke-width:1.5}
.arm{stroke:#2EC9A0;stroke-width:6;stroke-linecap:round}
.bob{animation:bob .4s ease-in-out infinite}
.road{stroke:#2A3D46;stroke-width:3;stroke-dasharray:12 12;animation:road .25s linear infinite}
.lines line{stroke:#5BC0EB;stroke-width:2.5;stroke-linecap:round;opacity:.5}
#mapov{position:fixed;inset:0;z-index:40;display:none;background:#000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
#mapov.on{display:flex}
#mapov canvas{max-width:100%;max-height:calc(100vh - 260px);max-height:calc(100dvh - 260px);border-radius:14px}
#mapmsg{margin:0;color:var(--ink);font-weight:700;text-align:center;font-size:1.1rem;padding:0 16px}
.mbtns{display:flex;flex-wrap:wrap;gap:10px;width:100%;max-width:460px}
.mbtns button{flex:1 1 28%;font:inherit;font-size:.92rem;font-weight:800;padding:14px 6px;border:0;border-radius:14px;background:var(--acc);color:#001018}
.mbtns button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
#speed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1.15 1 0}
#speed .tcard{padding:9px 12px;gap:4px;justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:10px;flex:6 1 0}
.grid2 .tcard{min-height:0;padding:8px 12px;gap:3px;justify-content:space-between}
.grid2 .temp{font-size:min(2.1rem,4.4vh);font-size:min(2.1rem,4.4dvh);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;margin:auto 0}
.grid2 .temp small{font-size:.65em;font-weight:800;color:inherit;margin-left:2px}
.grid2 .thead{font-size:.82rem;white-space:nowrap}
.grid2 .thead{gap:6px}
.grid2 .thead small{font-size:.74rem}
.ticks line{stroke:var(--mut);stroke-width:1.2;opacity:.8}
.ticks line.b{stroke:var(--ink);stroke-width:2;opacity:1}
.cl{font:800 9.5px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.cn{fill:var(--acc)}
.arrow{fill:var(--s);transition:transform .6s;filter:drop-shadow(0 0 3px var(--s))}
#batv{display:flex;align-items:center;gap:4px;height:32px;font-size:.85rem;font-weight:800;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 8px}
#batv svg{width:20px;height:11px;flex:none}
#batv small{font-size:.8em;font-weight:800;margin-left:-3px}
#bolt{margin-left:-2px}
.ic{width:1.15em;height:1.15em;color:var(--ic);stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;margin-right:4px}
.ti{display:inline-flex;align-items:center;white-space:nowrap}
.thead{align-items:center;gap:6px}
.grid2 .tcard.wind{grid-column:2;grid-row:5/span 2;background:linear-gradient(160deg,#0F1A20,#0B1114 65%);padding:8px 10px;gap:2px;justify-content:flex-start}
.dialwrap{flex:1;min-height:0;position:relative}
#dial{position:absolute;inset:0;width:100%;height:100%}
.wvn{font:800 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink);text-anchor:middle}
.wvu{font:700 5.6px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--mut);text-anchor:middle}
.grid2 .temp.txt{font-size:min(1.45rem,3.2vh);font-size:min(1.45rem,3.2dvh)}
.mbtns .mcap{flex:1 1 100%;margin:0;color:var(--mut);font-size:.85rem;font-weight:700;text-align:left}
.mbtns .share{flex:1 1 40%;background:#2EE077;color:#001a0d}
.mbtns .strava{flex:1 1 40%;background:#FC4C02;color:#fff}
</style>
</head>
<body>
<div id="top"><div><button id="start">AVVIA ▶︎</button><button id="fine" aria-label="Termina il giro e crea la mappa">FINE ■</button></div><h1 id="title">Kubocycle</h1><div id="batv" aria-label="Batteria"><svg id="gps" class="off" viewBox="0 0 24 24" aria-label="GPS"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><path d="M12 2.5v3.5M12 18v3.5M2.5 12H6M18 12h3.5"/></svg><svg viewBox="0 0 26 14"><rect x="1" y="1" width="21" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="23" y="4.5" width="2.5" height="5" rx="1" fill="currentColor"/><rect id="batfill" x="3" y="3" width="0" height="8" rx="1.5" fill="currentColor"/></svg><span id="bat">--</span><small>%</small><span id="bolt"></span></div></div>
<div id="err"></div>
<div id="main">
  <button id="hrbar" type="button" aria-label="Collega la fascia o l'orologio per i battiti"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 2.9 4.5 6.5 4.5c2 0 3.7 1.1 5.5 3.2 1.8-2.100 3.500-3.200 5.500-3.200 3.600 0 5.600 3.700 4.100 7.200C19.500 16.400 12 21 12 21z"/></svg><span id="hrv" class="idle">Cuore: tocca per collegare</span><span id="hrs"></span></button>
  <div id="speed">
    <div class="tcard"><div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#5BC0EB"><path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="M12 17l4.2-5.2"/><circle cx="12" cy="17" r="1.3" fill="currentColor"/></svg>Velocità</span><small>km/h</small></div><div class="big" id="sp">--</div></div>
    <div class="tcard"><div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#2EE077"><path d="M12 21s6.5-5.4 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15.6 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.3"/></svg>Km percorsi</span></div><div class="big" id="km">--</div></div>
  </div>
  <div class="grid2">
    <div class="tcard"><div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#FF7A59"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Vel. max</span><small>km/h</small></div><div class="temp" id="vmax">--</div></div>
    <div class="tcard"><div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#FFB830"><path d="M4 20V11M10 20V5M16 20v-6M3 20.5h18"/></svg>Vel. media</span><small>km/h</small></div><div class="temp" id="avg">--</div></div>
    <div class="tcard"><div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#B794F6"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 1.6M9.5 3h5"/></svg>In sella</span></div><div class="temp" id="elapsed">--</div></div>
    <div class="tcard"><div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#2DD4BF"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5l4-7.5h5.5l3.5 7.5M9.5 9l3.2 7.5M8 6h3"/></svg>Pedalando</span></div><div class="temp" id="mov">--</div></div>
    <div class="tcard"><div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#FF6B4A"><path d="M14 14.8V5.5a2 2 0 0 0-4 0v9.3a4 4 0 1 0 4 0z"/><path d="M12 9v7"/></svg>Temperatura</span></div><div class="temp"><span id="t">--</span><small>°C</small></div></div>
    <div class="tcard"><div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#7CC7FF"><path d="M8.5 14V5.5a2 2 0 0 0-4 0V14a3.6 3.6 0 1 0 4 0z"/><path d="M12.5 7.5h5a2 2 0 1 0-2-2M12.5 11.5h7a2 2 0 1 1-2 2"/></svg>Temp. percepita</span></div><div class="temp"><span id="feel">--</span><small>°C</small></div></div>
    <div class="tcard"><div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#FF9F43"><path d="M3 19h18M6.5 19a5.5 5.5 0 0 1 11 0M12 5v4M4.8 9.8l2 2M19.2 9.8l-2 2"/></svg>Tramonto</span><small id="sunL"></small></div><div class="temp" id="sunT">--:--</div></div>
    <div class="tcard"><div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#A5B4FC"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg>Ora</span></div><div class="temp" id="clock">--:--</div></div>
    <div class="tcard"><div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#84CC16"><path d="M2.5 19.5l6.5-11 4 6.5 2.5-3.5 6 8z"/></svg>Altitudine</span></div><div class="temp"><span id="alt">--</span><small>m</small></div></div>
    <div class="tcard"><div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#4DA3FF"><path d="M7 14.5a4.5 4.5 0 1 1 .9-8.9A5.5 5.5 0 0 1 18.4 7.5 3.6 3.6 0 0 1 17.5 14.5"/><path d="M8.5 17.5l-1 3M12.5 17.5l-1 3M16.5 17.5l-1 3"/></svg>Pioggia</span><small id="rainL"></small></div><div class="temp txt" id="rainV">--</div></div>
    <div class="tcard wind">
      <div class="thead"><span class="ti"><svg class="ic" viewBox="0 0 24 24" style="--ic:#38E0C8"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>Vento</span><small>da <span id="d">--</span></small></div>
      <div class="dialwrap">
      <svg id="dial" viewBox="-60 -60 120 120" aria-label="Bussola e direzione del vento rispetto alla tua marcia">
        <defs>
          <radialGradient id="fg" cx="50%" cy="42%" r="62%"><stop offset="0" stop-color="#1A2C34"/><stop offset="1" stop-color="#070C0F"/></radialGradient>
          <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5BC0EB"/><stop offset="1" stop-color="#2EE077"/></linearGradient>
        </defs>
        <circle r="45" fill="url(#fg)" stroke="url(#rg)" stroke-width="2.6"/>
        <circle r="26" fill="none" stroke="#24353D" stroke-width="1" stroke-dasharray="2 3"/>
        <g id="ticks" class="ticks"><line y1="-34" y2="-42" transform="rotate(0)" class="b"/><line y1="-38" y2="-42" transform="rotate(15)" class=""/><line y1="-38" y2="-42" transform="rotate(30)" class=""/><line y1="-38" y2="-42" transform="rotate(45)" class=""/><line y1="-38" y2="-42" transform="rotate(60)" class=""/><line y1="-38" y2="-42" transform="rotate(75)" class=""/><line y1="-34" y2="-42" transform="rotate(90)" class="b"/><line y1="-38" y2="-42" transform="rotate(105)" class=""/><line y1="-38" y2="-42" transform="rotate(120)" class=""/><line y1="-38" y2="-42" transform="rotate(135)" class=""/><line y1="-38" y2="-42" transform="rotate(150)" class=""/><line y1="-38" y2="-42" transform="rotate(165)" class=""/><line y1="-34" y2="-42" transform="rotate(180)" class="b"/><line y1="-38" y2="-42" transform="rotate(195)" class=""/><line y1="-38" y2="-42" transform="rotate(210)" class=""/><line y1="-38" y2="-42" transform="rotate(225)" class=""/><line y1="-38" y2="-42" transform="rotate(240)" class=""/><line y1="-38" y2="-42" transform="rotate(255)" class=""/><line y1="-34" y2="-42" transform="rotate(270)" class="b"/><line y1="-38" y2="-42" transform="rotate(285)" class=""/><line y1="-38" y2="-42" transform="rotate(300)" class=""/><line y1="-38" y2="-42" transform="rotate(315)" class=""/><line y1="-38" y2="-42" transform="rotate(330)" class=""/><line y1="-38" y2="-42" transform="rotate(345)" class=""/></g>
        <text class="cl cn" id="cN">N</text><text class="cl" id="cE">E</text><text class="cl" id="cS">S</text><text class="cl" id="cO">O</text>
        <path d="M0 -33 L5.5 -44 L-5.5 -44 Z" fill="#fff"/>
        <g id="arr" class="arrow"><path d="M0 -38 L12 -15 L4 -17 L4 30 L-4 30 L-4 -17 L-12 -15 Z"/></g>
        <circle r="14.5" fill="#0B1114" stroke="var(--s)" stroke-width="1.8"/>
        <text id="v" x="0" y="3" class="wvn">--</text><text x="0" y="10.6" class="wvu">km/h</text>
      </svg>
      </div>
    </div>
  </div>
</div>
<div id="egg" aria-hidden="true"><svg viewBox="0 0 200 130" aria-hidden="true">
  <defs><linearGradient id="kb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5BC0EB"/><stop offset="1" stop-color="#2EE077"/></linearGradient></defs>
  <line x1="0" y1="119" x2="200" y2="119" class="road"/>
  <g class="lines"><line x1="-6" y1="50" x2="22" y2="50"/><line x1="-14" y1="66" x2="14" y2="66"/><line x1="-2" y1="82" x2="20" y2="82"/></g>

<script>
const $=id=>document.getElementById(id);
const dirs=['N','NE','E','SE','S','SO','O','NO'];
const card=d=>dirs[Math.round(((d%360)+360)%360/45)%8];
const COL={con:['var(--con)','rgba(255,84,72,.14)'],fav:['var(--fav)','rgba(46,224,119,.14)'],lat:['var(--lat)','rgba(255,184,48,.14)'],none:['var(--mut)','rgba(138,155,163,.12)']};
let km=0,lastDistPt=null,lastDistTs=0,moving=0,maxSpd=0;
let track=[];
let prevSpd=0,moveRun=0;
let curPos=null,curSpd=0,ended=false,watchId=null,mapBlob=null;
let gAlt=null,altOff=null;
let hrNote=null,hrDev=null,hrChar=null,hrWanted=false,hrBpm=null,hrTs=0,hrSum=0,hrN=0,hrMax=0,hrBusy=false,recording=false,lastFixWall=0,geoErr=false,exported=false,savedStats=null,startTime=null;
let wx=null,lastFetch=0,lastFetchPos=null,lastPt=null,heading=null;

function dist(a,b){const R=6371e3,r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lon-a.lon)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);return(Math.atan2(y,x)/r+360)%360}

async function getWx(p){
  lastFetch=Date.now();lastFetchPos=p;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat.toFixed(4)}&longitude=${p.lon.toFixed(4)}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kmh`;
    const r=await fetch(u);if(!r.ok)throw 0;
    const j=await r.json(),c=j.current;
    wx={t:c.temperature_2m,h:c.relative_humidity_2m,v:c.wind_speed_10m,d:c.wind_direction_10m,g:c.wind_gusts_10m,rain:wx?wx.rain:null,elev:typeof j.elevation==='number'?j.elevation:null,time:new Date()};
    // altitudine: la quota GPS è liscia ma sfalsata; la allineo a quella del modello del terreno di Open-Meteo
    if(wx.elev!=null&&gAlt!=null){const off=wx.elev-gAlt;altOff=altOff==null?off:altOff*0.6+off*0.4}
    $('err').textContent='';
    getRain(p);
  }catch(e){
    lastFetch=Date.now()-270000;
    $('err').textContent='Meteo non disponibile: controlla la connessione dati.';
  }
  updateAlt();render();
}
// pioggia prevista nelle prossime 3 ore sulla tua posizione (richiesta separata, così un errore non blocca il vento)
async function getRain(p){
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat.toFixed(4)}&longitude=${p.lon.toFixed(4)}&minutely_15=precipitation&forecast_minutely_15=12&timeformat=unixtime`);
    if(!r.ok)throw 0;
    const m=(await r.json()).minutely_15;
    if(wx&&m&&m.time&&m.precipitation){wx.rain=m.time.map((t,i)=>({s:t-900,e:t,mm:m.precipitation[i]||0}));updateRain()}
  }catch(e){}
}
function updateRain(){
  const V=$('rainV'),L=$('rainL');
  if(!wx||!wx.rain){V.textContent='--';L.textContent='';V.style.color='';return}
  const now=Date.now()/1000;let cur=null,nxt=null;
  for(const q of wx.rain){
    if(q.e<=now)continue;
    if(q.s<=now){if(q.mm>=0.1)cur=q}
    else if(q.mm>=0.1&&!nxt)nxt=q;
  }
  const mm=q=>q.mm.toFixed(1).replace('.',',')+' mm';
  if(cur){V.textContent='In corso';V.style.color='#4DA3FF';L.textContent=mm(cur)}
  else if(nxt){const m=Math.max(1,Math.ceil((nxt.s-now)/60));V.textContent='tra '+(m>=60?Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'):m+' min');V.style.color=m<=30?'#4DA3FF':'';L.textContent=mm(nxt)}
  else{V.textContent='Asciutto';V.style.color='';L.textContent='3 h'}
}
function curAlt(){
  if(gAlt!=null&&altOff!=null)return gAlt+altOff;
  if(wx&&wx.elev!=null)return wx.elev;
  return gAlt;
}
function updateAlt(){const a=curAlt();$('alt').textContent=a==null?'--':Math.round(a)}

let dbgShown=false,lastFixTs=0;
// Filtro di Kalman (posizione + velocità, in metri locali) per i telefoni con GPS lento o impreciso
const recent=[];
// true = sei fermo, false = ti stai muovendo, null = ancora poco storico. Confronta lo spostamento netto degli ultimi 25-40 s con la precisione del GPS
function isStationary(p,ts,acc){
  recent.push({lat:p.lat,lon:p.lon,ts,acc});
  const W=acc>25?40000:25000;      // con GPS scarso guardo un periodo più lungo
  while(recent.length>2&&ts-recent[0].ts>W)recent.shift();
  if(ts-recent[0].ts<8000)return null;
  const am=recent.reduce((a,r)=>a+r.acc,0)/recent.length;
  return dist(recent[0],p)<Math.max(12,2.5*am);
}
let kf=null,lastKTs=0,KQ=0.08,KDZ=1.5;
function kfUpdate(p,ts,acc){
  const R=Math.max(acc,5)**2,q=acc<=10?0.3:acc>=40?KQ:0.3+(KQ-0.3)*(acc-10)/30; // GPS buono: risposta rapida; GPS scarso: più filtro
  if(!kf)kf={lat0:p.lat,lon0:p.lon,ts,x:0,y:0,vx:0,vy:0,Ppp:R,Ppv:0,Pvv:25,n:1,rej:0,speed:null,heading:null};
  else{
    const dt=(ts-kf.ts)/1000;
    if(dt<=0)return kf;
    if(dt>60){kf=null;return kfUpdate(p,ts,acc)}
    kf.x+=kf.vx*dt;kf.y+=kf.vy*dt;
    const a=kf.Ppp+2*dt*kf.Ppv+dt*dt*kf.Pvv+q*dt**4/4,b=kf.Ppv+dt*kf.Pvv+q*dt**3/2,c=kf.Pvv+q*dt*dt;
    kf.Ppp=a;kf.Ppv=b;kf.Pvv=c;kf.ts=ts;
    const zx=(p.lon-kf.lon0)*111320*Math.cos(kf.lat0*Math.PI/180),zy=(p.lat-kf.lat0)*110540;
    const ix=zx-kf.x,iy=zy-kf.y,S=kf.Ppp+R;
    if((ix*ix+iy*iy)/S>12){            // salto improbabile: ignoro la posizione
      if(++kf.rej>=3){kf=null;return kfUpdate(p,ts,acc)}
      return kf;
    }
    kf.rej=0;
    const Kp=kf.Ppp/S,Kv=kf.Ppv/S;
    kf.x+=Kp*ix;kf.y+=Kp*iy;kf.vx+=Kv*ix;kf.vy+=Kv*iy;
    kf.Pvv-=Kv*kf.Ppv;kf.Ppv*=(1-Kp);kf.Ppp*=(1-Kp);
    kf.n++;
  }
  if(kf.n>=3){kf.sv=Math.sqrt(kf.Pvv);kf.speed=Math.hypot(kf.vx,kf.vy);kf.heading=(Math.atan2(kf.vx,kf.vy)*180/Math.PI+360)%360}
  return kf;
}

function onPos(pos){
  const c=pos.coords,p={lat:c.latitude,lon:c.longitude};
  lastFixWall=Date.now();setGps();
  if(geoErr){geoErr=false;$('err').textContent='';$('err').style.color=''}
  let rep=(c.speed==null||isNaN(c.speed))?null:c.speed;
  const k=kfUpdate(p,pos.timestamp,c.accuracy);
  const ks=k&&k.speed!=null?(k.speed<Math.max(0.7,KDZ*k.sv)?0:k.speed):null;
  const st=isStationary(p,pos.timestamp,c.accuracy);
  // scarto la velocità del telefono solo se è assurdamente più alta di quella stimata dal filtro
  if(rep!=null&&(rep>27||(ks!=null&&rep>ks+6&&rep>8)))rep=null;
  moveRun=st===false?moveRun+1:0;
  let spd;
  if(rep!=null)spd=(rep<1||(st===true&&rep<2.5))?0:rep;           // il telefono dà la velocità: mi fido, ma un fruscio da fermo diventa 0
  else spd=st===false?((c.accuracy>25&&moveRun<2)?0:ks):(st===true?0:null);              // altrimenti uso il filtro, solo se risulta davvero un movimento
  curSpd=spd==null?0:spd;curPos=p;
  $('sp').textContent=spd==null?'--':(spd<0.5?'0':Math.round(spd*3.6));
  if(c.altitude!=null&&!isNaN(c.altitude)&&c.accuracy<=40&&(c.altitudeAccuracy==null||c.altitudeAccuracy<=40))gAlt=gAlt==null?c.altitude:gAlt+0.25*(c.altitude-gAlt);
  updateAlt();
  const sus=spd==null?0:Math.min(spd,prevSpd);            // velocità sostenuta per due fix di fila
  if(recording&&sus>maxSpd&&sus<=27){maxSpd=sus;$('vmax').textContent=Math.round(maxSpd*3.6)}
  prevSpd=spd==null?0:spd;
  if(spd==null||c.accuracy>50){
    const gap=lastFixTs?Math.round((pos.timestamp-lastFixTs)/1000):0;
    $('err').style.color='var(--mut)';dbgShown=true;
    $('err').textContent=c.accuracy>50?'GPS poco preciso ('+Math.round(c.accuracy)+' m): i valori sono indicativi':'GPS: precisione '+Math.round(c.accuracy)+' m, velocità '+(rep==null?'non fornita':'0')+(gap?', ultimo aggiornamento '+gap+' s fa':'');
  }else if(dbgShown){dbgShown=false;$('err').textContent='';$('err').style.color=''}
  lastFixTs=pos.timestamp;
  // km e tempo in movimento: integro la velocità sul tempo tra due posizioni
  if(recording){
    if(lastKTs&&spd!=null&&spd>=0.8){const dts=(pos.timestamp-lastKTs)/1000;if(dts>0&&dts<=15){km+=spd*dts;moving+=dts*1000}}
    $('km').textContent=(km/1000).toFixed(1).replace('.',',');
    $('avg').textContent=moving>=10000?((km/1000)/(moving/3600000)).toFixed(1).replace('.',','):'--';
  }
  lastKTs=pos.timestamp;
  if(!lastPt)lastPt=p;
  if(sus>=1.5){        // la direzione si aggiorna solo se ti stai davvero muovendo (due fix di fila)
    if(rep!=null&&c.heading!=null&&!isNaN(c.heading))heading=c.heading;
    else if(ks!=null&&ks>1.5&&k.heading!=null)heading=k.heading;
    else if(rep!=null&&dist(lastPt,p)>15){heading=bearing(lastPt,p);lastPt=p}
  }
  // registro il punto per il GPX: se la posizione è poco precisa uso quella filtrata; da fermo salvo un punto ogni 30 s
  if(recording&&c.accuracy<=100){
    let la=p.lat,lo=p.lon;
    if(c.accuracy>20&&k&&k.n>=2){la=k.lat0+k.y/110540;lo=k.lon0+k.x/(111320*Math.cos(k.lat0*Math.PI/180))}
    const last=track[track.length-1],still=spd!=null&&spd<0.5;
    if(!last||!(still&&pos.timestamp-last[2]<30000))track.push([la,lo,pos.timestamp,curAlt(),curHr()]);
  }
  if(!wx||Date.now()-lastFetch>300000||(lastFetchPos&&dist(lastFetchPos,p)>1000))getWx(p);
  else render();
}

function startWatch(){
  if(watchId!=null)return true;
  if(!navigator.geolocation){$('err').textContent='Questo browser non supporta la posizione.';return false}
  watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  return true;
}
function onErr(e){
  geoErr=true;$('err').style.color='';
  if(e.code===1&&watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}
  $('err').textContent=e.code===1?'Permesso posizione negato: consentilo nelle impostazioni del browser e riprova.':'Posizione non disponibile. Esci all\'aperto e riprova.';
}

function setState(k){
  document.documentElement.style.setProperty('--s',COL[k][0]);
}

function updateRose(h){
  [['cN',0],['cE',90],['cS',180],['cO',270]].forEach(([id,a])=>{
    const r=(a-h)*Math.PI/180,e=$(id);
    e.setAttribute('x',(53*Math.sin(r)).toFixed(1));e.setAttribute('y',(-53*Math.cos(r)).toFixed(1));
  });
  $('ticks').style.transform=`rotate(${-h}deg)`;
}

function render(){
  updateRose(heading??0);
  $('arr').style.opacity=wx?'':'0';
  if(!wx)return;
  $('t').textContent=Math.round(wx.t);
  const fl=feelsLike();if(fl!=null)$('feel').textContent=Math.round(fl);
  $('v').textContent=Math.round(wx.v);
  $('d').textContent=card(wx.d);
  const rel=wx.d-(heading??0),rad=rel*Math.PI/180;
  $('arr').style.transform=`rotate(${rel+180}deg)`;
  const head=wx.v*Math.cos(rad),cross=wx.v*Math.sin(rad);
  if(heading==null){setState('none');return}
  if(Math.abs(cross)>Math.abs(head)&&Math.abs(cross)>=4)setState('lat');
  else setState(head>=0?'con':'fav');
}

async function keepAwake(){try{await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&recording)keepAwake()});

function setGps(){const ok=lastFixWall&&Date.now()-lastFixWall<15000,g=$('gps');g.classList.toggle('on',!!ok);g.classList.toggle('off',!ok)}
function tick(){
  $('clock').textContent=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  if(recording&&startTime){const m=Math.floor((Date.now()-startTime)/60000);$('elapsed').textContent=Math.floor(m/60)+':'+String(m%60).padStart(2,'0');const mm=Math.floor(moving/60000);$('mov').textContent=Math.floor(mm/60)+':'+String(mm%60).padStart(2,'0')}
  setGps();hrShow();updateSun();updateRain();
}
tick();setInterval(tick,1000);

function goFull(){
  const el=document.documentElement;
  if(document.fullscreenElement||!el.requestFullscreen)return;
  try{el.requestFullscreen({navigationUI:'hide'}).catch(()=>{})}catch(e){}
}
// toccando un punto qualsiasi dello schermo si rientra a schermo intero
document.addEventListener('click',goFull);

updateRose(0);$('arr').style.opacity='0';

// batteria: la mette a disposizione Chrome, Firefox no; se il dato non è affidabile compare n/d
function nd(){$('bat').textContent='n/d';$('batv').querySelector('small').style.display='none';$('batfill').setAttribute('width',0);$('bolt').textContent='';$('batv').style.color=''}
if(navigator.getBattery){
  navigator.getBattery().then(b=>{
    const u=()=>{
      // livello 100%, in carica, 0 s alla carica completa: sono i valori "di ripiego" che il browser dà quando non riesce a leggere la batteria
      if(b.level===1&&b.charging&&b.chargingTime===0&&b.dischargingTime===Infinity){nd();return}
      $('batv').querySelector('small').style.display='';
      const p=Math.round(b.level*100);
      $('bat').textContent=p;
      $('batfill').setAttribute('width',Math.max(1,Math.round(18*b.level)));
      $('bolt').textContent=b.charging?'⚡':'';
      $('batv').style.color=b.charging?'':(p<=10?'var(--con)':p<=20?'var(--lat)':'');
    };
    u();b.addEventListener('levelchange',u);b.addEventListener('chargingchange',u);
  }).catch(nd);
}else nd();

// ---- percorso GPX: salvato anche nel browser, così non si perde se la pagina si chiude ----
const TK='kubocycle-track';
function saveTrack(){try{localStorage.setItem(TK,JSON.stringify(track));if(startTime)localStorage.setItem(TK+'-s',JSON.stringify({km,moving,maxSpd,hs:hrSum,hn:hrN,hm:hrMax,el:Date.now()-startTime}))}catch(e){}}
function clearSaved(){track=[];savedStats=null;try{localStorage.removeItem(TK);localStorage.removeItem(TK+'-s')}catch(e){}}
function statsFromTrack(){let d=0,m=0;for(let i=1;i<track.length;i++){const a={lat:track[i-1][0],lon:track[i-1][1]},b={lat:track[i][0],lon:track[i][1]},sd=dist(a,b),dt=(track[i][2]-track[i-1][2])/1000;d+=sd;if(dt>0&&dt<=60&&sd/dt>=0.8)m+=dt*1000}let hs=0,hn=0,hm=0;for(const q of track)if(q[4]>0){hs+=q[4];hn++;hm=Math.max(hm,q[4])}return{km:d,moving:m,maxSpd:0,hs,hn,hm,el:track[track.length-1][2]-track[0][2]}}
try{const t=JSON.parse(localStorage.getItem(TK)||'[]');if(Array.isArray(t))track=t}catch(e){}
try{savedStats=JSON.parse(localStorage.getItem(TK+'-s')||'null')}catch(e){}
if(track.length>=2&&!savedStats)savedStats=statsFromTrack();
setInterval(saveTrack,15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveTrack()});
addEventListener('pagehide',saveTrack);
function toast(m){const e=$('mapov').classList.contains('on')?$('mapmsg'):$('err');if(e===$('err'))e.style.color='var(--mut)';e.textContent=m;setTimeout(()=>{if(e.textContent===m)e.textContent=''},5000)}
function gpxData(){
  const iso=ms=>new Date(ms).toISOString(),pad=n=>String(n).padStart(2,'0'),d0=new Date(track[0][2]);
  const nome='Kubocycle '+d0.toLocaleString('it-IT');
  let x='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Kubocycle" xmlns="http://www.topografix.com/GPX/1/1" xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">\n<metadata><name>'+nome+'</name><time>'+iso(track[0][2])+'</time></metadata>\n<trk><name>'+nome+'</name><trkseg>\n';
  for(const q of track)x+='<trkpt lat="'+q[0].toFixed(6)+'" lon="'+q[1].toFixed(6)+'">'+(q[3]!=null?'<ele>'+q[3].toFixed(1)+'</ele>':'')+'<time>'+iso(q[2])+'</time>'+(q[4]>0?'<extensions><gpxtpx:TrackPointExtension><gpxtpx:hr>'+q[4]+'</gpxtpx:hr></gpxtpx:TrackPointExtension></extensions>':'')+'</trkpt>\n';
  x+='</trkseg></trk>\n</gpx>\n';
  return {x,fn:'kubocycle-'+d0.getFullYear()+pad(d0.getMonth()+1)+pad(d0.getDate())+'-'+pad(d0.getHours())+pad(d0.getMinutes())+'.gpx'};
}
function downloadGpx(){
  if(track.length<2){toast('Nessun percorso registrato: premi prima Avvia');return}
  saveTrack();
  const {x,fn}=gpxData();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([x],{type:'application/gpx+xml'}));a.download=fn;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);
  exported=true;toast('Scaricato '+fn+' ('+track.length+' punti)');
}

// ---- temperatura percepita (formula di Steadman con il vento apparente: vento + tua velocità) ----
function feelsLike(){
  if(!wx)return null;
  const T=wx.t,V=wx.v/3.6,s=curSpd||0,r=Math.PI/180;
  let ws;
  if(heading!=null&&s>0.5){
    const ax=-V*Math.sin(wx.d*r)-s*Math.sin(heading*r),ay=-V*Math.cos(wx.d*r)-s*Math.cos(heading*r);
    ws=Math.hypot(ax,ay);
  }else ws=Math.hypot(V,s);
  const h=wx.h==null?50:wx.h,e=h/100*6.105*Math.exp(17.27*T/(237.7+T));
  return T+0.33*e-0.70*ws-4.00;
}

// ---- tramonto (calcolo astronomico locale, nessuna connessione) ----
function sunsetDate(lat,lon,now){
  const R=Math.PI/180,Jn=now/86400000+2440587.5;
  const n=Math.round(Jn-2451545.0+lon/360),Js=n-lon/360;
  const M=((357.5291+0.98560028*Js)%360+360)%360,Mr=M*R;
  const C=1.9148*Math.sin(Mr)+0.02*Math.sin(2*Mr)+0.0003*Math.sin(3*Mr);
  const lr=((((M+C+180+102.9372)%360)+360)%360)*R;
  const Jt=2451545.0+Js+0.0053*Math.sin(Mr)-0.0069*Math.sin(2*lr);
  const sinD=Math.sin(lr)*Math.sin(23.4397*R),cosD=Math.cos(Math.asin(sinD));
  const cw=(Math.sin(-0.833*R)-Math.sin(lat*R)*sinD)/(Math.cos(lat*R)*cosD);
  if(cw<-1||cw>1)return null;
  return new Date((Jt+Math.acos(cw)/R/360-2440587.5)*86400000);
}
function updateSun(){
  if(!curPos)return;
  const now=Date.now(),sd=sunsetDate(curPos.lat,curPos.lon,now),L=$('sunL');
  if(!sd){$('sunT').textContent='--:--';L.textContent='';return}
  $('sunT').textContent=sd.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  const diff=sd.getTime()-now,mins=Math.floor(diff/60000);
  if(diff>=0&&mins<600){
    L.textContent='tra '+(mins>=60?Math.floor(mins/60)+'h'+String(mins%60).padStart(2,'0'):mins+' min');
    L.style.color=diff<=1800000?'var(--con)':diff<=3600000?'var(--lat)':'';
  }else L.textContent='';
}

// ---- fine giro: mappa satellitare con il percorso, salvata come JPG ----
const TILE='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/';
function loadTile(z,x,y){return new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';const t=setTimeout(()=>res(null),9000);im.onload=()=>{clearTimeout(t);res(im)};im.onerror=()=>{clearTimeout(t);res(null)};im.src=TILE+z+'/'+y+'/'+x})}
const mx=(lon,z)=>(lon+180)/360*256*2**z;
const my=(lat,z)=>{const s=Math.sin(lat*Math.PI/180);return(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*2**z};
const fmtDur=ms=>{const m=Math.round(ms/60000),h=Math.floor(m/60);return h>0?h+' h '+String(m%60).padStart(2,'0')+' min':m+' min'};
function rideStats(){
  const t0=track[0][2],tot=track[track.length-1][2]-t0;
  let d=0;for(let i=1;i<track.length;i++)d+=dist({lat:track[i-1][0],lon:track[i-1][1]},{lat:track[i][0],lon:track[i][1]});
  const live=startTime!==null,sv=!live?savedStats:null;
  const hn=live?hrN:(sv?sv.hn||0:0),hs=live?hrSum:(sv?sv.hs||0:0),hm=live?hrMax:(sv?sv.hm||0:0);
  return {t0,tot,hrAvg:hn>=5?hs/hn:null,hrMax:hn>=5?hm:null,kmm:live?km:(sv?sv.km:d),mov:live?moving:(sv?sv.moving:null),vm:live?maxSpd:(sv&&sv.maxSpd>0?sv.maxSpd:null),
    avg:live&&moving>=10000?(km/1000)/(moving/3600000):(sv&&sv.moving>=10000?(sv.km/1000)/(sv.moving/3600000):(tot>0?(d/1000)/(tot/3600000):null))};
}
async function buildMap(){
  let pts=track.map(q=>[q[0],q[1]]);
  if(pts.length>4000){const k=Math.ceil(pts.length/4000);pts=pts.filter((_,i)=>i%k===0||i===pts.length-1)}
  const W=1080,H=1350,fx=110,fy=170,fw=W-220,fh=H-170-360;
  let a=90,b=-90,c=180,d=-180;
  pts.forEach(([la,lo])=>{a=Math.min(a,la);b=Math.max(b,la);c=Math.min(c,lo);d=Math.max(d,lo)});
  let z=17;
  for(;z>3;z--){if(mx(d,z)-mx(c,z)<=fw&&my(a,z)-my(b,z)<=fh)break}
  const cx=(mx(c,z)+mx(d,z))/2,cy=(my(a,z)+my(b,z))/2,ox=cx-(fx+fw/2),oy=cy-(fy+fh/2);
  const cv=$('mapc');cv.width=W;cv.height=H;
  const g=cv.getContext('2d');
  g.fillStyle='#0B1114';g.fillRect(0,0,W,H);
  const n=2**z,x0=Math.floor(ox/256),x1=Math.floor((ox+W)/256),y0=Math.max(0,Math.floor(oy/256)),y1=Math.min(n-1,Math.floor((oy+H)/256));
  const jobs=[];
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    jobs.push(loadTile(z,((tx%n)+n)%n,ty).then(im=>{if(im)g.drawImage(im,tx*256-ox,ty*256-oy,256,256);return !!im}));
  }
  const okTiles=(await Promise.all(jobs)).filter(Boolean).length;
  // velature per leggere i testi
  let gr=g.createLinearGradient(0,0,0,230);gr.addColorStop(0,'rgba(0,0,0,.78)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,W,230);
  // percorso
  const P=pts.map(([la,lo])=>[mx(lo,z)-ox,my(la,z)-oy]);
  g.lineJoin='round';g.lineCap='round';g.beginPath();
  P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
  g.strokeStyle='rgba(0,0,0,.65)';g.lineWidth=17;g.stroke();
  g.strokeStyle='#5BC0EB';g.lineWidth=9;g.stroke();
  const pin=(p,col)=>{g.beginPath();g.arc(p[0],p[1],22,0,7);g.fillStyle=col;g.fill();g.lineWidth=6;g.strokeStyle='#fff';g.stroke()};
  pin(P[0],'#2EE077');pin(P[P.length-1],'#FF5448');
  // titolo e data
  const tg=g.createLinearGradient(50,0,420,0);tg.addColorStop(0,'#5BC0EB');tg.addColorStop(1,'#2EE077');
  g.textAlign='left';g.textBaseline='alphabetic';
  g.fillStyle=tg;g.font='900 62px system-ui,sans-serif';g.fillText('KUBOCYCLE',50,92);
  const S=rideStats(),dt=new Date(S.t0);
  g.fillStyle='#F2F5F6';g.font='600 30px system-ui,sans-serif';
  g.fillText(dt.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),50,140);
  // riquadro dati
  g.fillStyle='rgba(0,0,0,.68)';g.beginPath();g.roundRect(40,H-320,W-80,270,32);g.fill();
  const cells=[['Distanza',(S.kmm/1000).toFixed(1).replace('.',',')+' km'],['In sella',fmtDur(S.tot)],['Pedalando',S.mov==null?'n/d':fmtDur(S.mov)],
    ['Media',S.avg==null?'n/d':S.avg.toFixed(1).replace('.',',')+' km/h'],['Vel. max',S.vm==null?'n/d':Math.round(S.vm*3.6)+' km/h'],
    S.hrAvg==null?['Partenza',dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})]:['Cuore med/max',Math.round(S.hrAvg)+'/'+S.hrMax+' bpm']];
  const cw=(W-80)/3;
  cells.forEach(([l,v],i)=>{
    const x=40+cw*(i%3)+34,y=H-320+(i<3?0:125);
    g.fillStyle='#BCC9D0';g.font='700 28px system-ui,sans-serif';g.fillText(l,x,y+58);
    g.fillStyle='#F2F5F6';let fs=44;g.font='800 '+fs+'px system-ui,sans-serif';while(fs>26&&g.measureText(v).width>cw-50){fs-=2;g.font='800 '+fs+'px system-ui,sans-serif'}g.fillText(v,x,y+108);
  });
  g.textAlign='right';g.fillStyle='rgba(255,255,255,.85)';g.font='19px system-ui,sans-serif';
  g.fillText(okTiles?'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community':'Mappa satellitare non disponibile',W-30,H-14);
  mapBlob=await new Promise(res=>{try{cv.toBlob(res,'image/jpeg',0.9)}catch(e){res(null)}});
  return okTiles;
}
function downloadJpg(){
  if(!mapBlob){toast('Immagine non disponibile');return}
  const d0=new Date(track[0][2]),pad=n=>String(n).padStart(2,'0');
  const fn='kubocycle-'+d0.getFullYear()+pad(d0.getMonth()+1)+pad(d0.getDate())+'-'+pad(d0.getHours())+pad(d0.getMinutes())+'.jpg';
  const a=document.createElement('a');a.href=URL.createObjectURL(mapBlob);a.download=fn;exported=true;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);
}
async function doFine(skip){
  if(track.length<2){
    if(recording){if(confirm('Il giro non ha ancora punti registrati. Annullarlo?')){clearSaved();location.reload()}}
    else toast('Nessun percorso registrato: premi prima Avvia');
    return;
  }
  if(skip!==true&&!confirm('Terminare il giro e creare la mappa?'))return;
  $('resume').classList.remove('on');
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}
  ended=true;recording=false;saveTrack();
  $('mapov').classList.add('on');$('mapmsg').textContent='Creo la mappa…';$('mapc').style.display='none';$('mbtns').style.display='none';
  let ok=0;
  try{ok=await buildMap()}catch(e){ok=0;mapBlob=null}
  $('mapc').style.display='block';$('mbtns').style.display='flex';
  $('mapmsg').textContent=!mapBlob?'Non sono riuscito a creare l\'immagine, ma il percorso è salvato: scarica il GPX.':ok?'':'Mappa satellitare non disponibile (serve la connessione dati): disegnato solo il percorso.';
}
$('fine').onclick=()=>doFine(false);
$('mstrava').onclick=()=>{downloadGpx();exported=true;window.open('https://www.strava.com/upload/select','_blank','noopener');$('mapmsg').textContent="GPX scaricato: su Strava scegli il file dall'elenco Download."};
async function sharePhoto(){
  const msg=t=>{$('mapmsg').textContent=t};
  if(!navigator.share||!navigator.canShare){msg('Questo browser non supporta la condivisione: usa Salva JPG.');return}
  if(!mapBlob){msg('Immagine non disponibile');return}
  const f=new File([mapBlob],'kubocycle-'+new Date(track[0][2]).toISOString().slice(0,10)+'.jpg',{type:'image/jpeg'});
  if(!navigator.canShare({files:[f]})){msg('Il browser non permette di condividere la foto: usa Salva JPG.');return}
  try{await navigator.share({files:[f],title:'Kubocycle'});exported=true;msg('')}
  catch(e){msg(e&&e.name!=='AbortError'?'Condivisione non riuscita: '+(e.message||e.name):'')}
}
$('mshf').onclick=sharePhoto;
$('mjpg').onclick=downloadJpg;
$('mgpx').onclick=downloadGpx;
$('mclose').onclick=()=>{
  if(!exported&&!confirm('Non hai ancora salvato né condiviso nulla: chiudendo, il percorso viene cancellato. Chiudere?'))return;
  clearSaved();location.reload();
};


// ---- battiti: sensore Bluetooth standard (fascia, o orologio che trasmette come fascia). Solo Chrome (Web Bluetooth) ----
function curHr(){return hrBpm!=null&&Date.now()-hrTs<10000?hrBpm:null}
function hrShow(state){
  if(state!==undefined)hrNote=[state,Date.now()];
  state=hrNote&&Date.now()-hrNote[1]<6000?hrNote[0]:null;
  const b=$('hrbar'),v=$('hrv'),r=$('hrs'),h=curHr();
  b.className=hrWanted?(h!=null?'on':'wait'):'';
  if(!hrWanted){v.className='idle';v.textContent=state||'Cuore: tocca per collegare';r.textContent='';return}
  if(h==null){v.className='idle';v.textContent=state||'Cuore: cerco il segnale…';r.textContent=''}
  else{v.className='';v.innerHTML=h+'<small>bpm</small>'}
  r.textContent=recording&&hrN>=5?'media '+Math.round(hrSum/hrN)+' · max '+hrMax:'';
}
function onHr(ev){
  const dv=ev.target.value,f=dv.getUint8(0);
  if((f&2)&&!(f&4)){hrBpm=null;hrShow('Cuore: sensore non a contatto');return}   // il sensore dice che non tocca la pelle
  const bpm=(f&1)?dv.getUint16(1,true):dv.getUint8(1);
  if(!(bpm>=30&&bpm<=230))return;
  hrBpm=bpm;hrTs=Date.now();hrNote=null;
  if(recording){hrSum+=bpm;hrN++;if(bpm>hrMax)hrMax=bpm}
  hrShow();
}
async function hrOpen(){
  const srv=await hrDev.gatt.connect(),svc=await srv.getPrimaryService('heart_rate');
  hrChar=await svc.getCharacteristic('heart_rate_measurement');
  hrChar.addEventListener('characteristicvaluechanged',onHr);
  await hrChar.startNotifications();
}
async function hrRetry(){
  if(!hrWanted||hrBusy||!hrDev)return;
  hrBusy=true;
  try{await hrOpen();hrNote=null;hrShow()}
  catch(e){setTimeout(()=>{hrBusy=false;hrRetry()},4000);return}
  hrBusy=false;
}
function hrLost(){hrBpm=null;hrShow('Cuore: segnale perso, riprovo…');setTimeout(hrRetry,2000)}
let hrDown=0;
$('hrbar').addEventListener('pointerdown',()=>{hrDown=Date.now()});
$('hrbar').addEventListener('click',async ev=>{
  ev.stopPropagation();
  if(hrWanted){                                   // secondo tocco: scollega
    hrWanted=false;hrBpm=null;
    try{hrDev&&hrDev.gatt.connected&&hrDev.gatt.disconnect()}catch(e){}
    hrDev=null;hrShow();return;
  }
  if(!navigator.bluetooth){hrShow('Cuore: serve Chrome (non Firefox/Brave)');return}
  const all=Date.now()-hrDown>700;                // tocco lungo: mostra tutti i dispositivi Bluetooth
  try{
    hrShow('Cuore: scelgo il dispositivo…');
    hrDev=await navigator.bluetooth.requestDevice(all?{acceptAllDevices:true,optionalServices:['heart_rate']}:{filters:[{services:['heart_rate']}]});
    hrWanted=true;hrShow('Cuore: mi collego…');
    hrDev.addEventListener('gattserverdisconnected',hrLost);
    await hrOpen();hrNote=null;hrShow();
  }catch(e){
    if(hrWanted){hrBusy=false;hrLost()}
    else hrShow(e&&e.name==='NotFoundError'?'Cuore: nessun dispositivo scelto. Tocco lungo = elenco completo':'Cuore: errore ('+((e&&e.message)||e)+')');
  }
});

// ---- avvio giro: il GPS è già attivo dall'apertura, qui parte la registrazione ----
function startRide(resume){
  goFull();keepAwake();
  if(!startWatch())return;
  if(resume){const v=savedStats||{km:0,moving:0,maxSpd:0,el:0};km=v.km;moving=v.moving;maxSpd=v.maxSpd||0;hrSum=v.hs||0;hrN=v.hn||0;hrMax=v.hm||0;startTime=Date.now()-(v.el||0)}
  else{clearSaved();km=0;moving=0;maxSpd=0;hrSum=0;hrN=0;hrMax=0;startTime=Date.now()}
  recording=true;exported=false;document.body.classList.add('rec');saveTrack();
  $('vmax').textContent=Math.round(maxSpd*3.6);
  $('km').textContent=(km/1000).toFixed(1).replace('.',',');
  $('avg').textContent=moving>=10000?((km/1000)/(moving/3600000)).toFixed(1).replace('.',','):'--';
  hrShow();tick();
}
$('start').onclick=()=>startRide(false);

// percorso rimasto salvato (blocco, chiusura): riprendere, concludere o scartare
if(track.length>=2){
  const v=savedStats||statsFromTrack(),d0=new Date(track[0][2]);
  $('rinfo').textContent=d0.toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' · '+(v.km/1000).toFixed(1).replace('.',',')+' km · '+track.length+' punti';
  $('resume').classList.add('on');
  $('rres').onclick=()=>{$('resume').classList.remove('on');startRide(true)};
  $('rend').onclick=()=>doFine(true);
  $('rdel').onclick=()=>{if(confirm('Cancellare il percorso salvato?')){clearSaved();$('resume').classList.remove('on')}};
}
startWatch();
